<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Receta de prueba para importación E2E</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Recipe",
        "name": "Tortilla de patatas importada",
        "description": "Receta servida como fixture JSON-LD para la prueba E2E de importación.",
        "recipeYield": "4 raciones",
        "prepTime": "PT15M",
        "cookTime": "PT20M",
        "recipeIngredient": [
          "400 g de patatas",
          "4 huevos",
          "10 ml de aceite de oliva",
          "1 pizca de sal"
        ],
        "recipeInstructions": [
          "Pelar y cortar las patatas en láminas finas.",
          "Freír las patatas en aceite hasta que estén tiernas.",
          "Batir los huevos con sal, mezclar con las patatas y cuajar la tortilla."
        ]
      }
    </script>
  </head>
  <body>
    <h1>Tortilla de patatas importada</h1>
    <p>Fixture estático servido dentro de la red E2E para validar la importación por URL.</p>
  </body>
</html>
