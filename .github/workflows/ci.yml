name: CI

on:
  push:
    branches:
      - main
      - ci/github-actions
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @recipe-planner/contracts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @recipe-planner/contracts

      - name: Unit tests with coverage
        run: npm run test:unit -w backend -- --coverage

      - name: Integration tests
        run: npm run test:integration -w backend

      - name: Build backend
        run: npm run build -w backend

      - name: Verify exported OpenAPI spec
        run: |
          npm run export:openapi -w backend
          git diff --exit-code -- packages/contracts/openapi.json

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @recipe-planner/contracts

      - name: Tests with coverage
        run: npm run test -w frontend -- --coverage

      - name: Next build
        run: npm run build -w frontend

      - name: Verify generated API types
        run: |
          npm run generate:api-types -w frontend
          git diff --exit-code -- frontend/src/server/openapi.d.ts

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up --build --wait

      - name: Run E2E tests
        run: npm run test -w e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Show E2E stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs backend frontend worker minio minio-init mongo redis mailpit fixtures

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans
