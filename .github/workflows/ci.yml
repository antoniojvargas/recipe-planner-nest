name: CI

on:
  push:
    branches:
      - main
      - ci/github-actions
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @recipe-planner/contracts

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @recipe-planner/contracts

      - name: Unit tests with coverage
        run: npm run test:unit -w backend -- --coverage

      - name: Integration tests
        run: npm run test:integration -w backend

      - name: Build backend
        run: npm run build -w backend

      - name: Verify exported OpenAPI spec
        run: |
          npm run export:openapi -w backend
          git diff --exit-code -- packages/contracts/openapi.json

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @recipe-planner/contracts

      - name: Tests with coverage
        run: npm run test -w frontend -- --coverage

      - name: Next build
        run: npm run build -w frontend

      - name: Verify generated API types
        run: |
          npm run generate:api-types -w frontend
          git diff --exit-code -- frontend/src/server/openapi.d.ts

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=critical

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start E2E stack
        run: docker compose -f docker-compose.e2e.yml up --build --wait

      - name: Run E2E tests
        run: npm run test -w e2e

      - name: Upload E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore

      - name: Show E2E stack logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs backend frontend worker minio minio-init mongo redis mailpit fixtures

      - name: Stop E2E stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  build-prod-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build

      - name: Verify the images run as a non-root user
        run: |
          for image in recipes-backend:prod recipes-frontend:prod; do
            user=$(docker inspect -f '{{.Config.User}}' "$image")
            uid=$(docker run --rm --entrypoint sh "$image" -c 'id -u')
            echo "$image -> User=$user uid=$uid"
            test "$user" = "node"
            test "$uid" != "0"
          done

      # El compose lee ocho secretos desde secrets/*.txt. Se generan aquí, nunca se versionan.
      - name: Create throwaway secrets for the prod stack
        run: |
          gen() { openssl rand -base64 48 | tr -d '/+=' | head -c 40; }
          mongo_password=$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)
          redis_password=$(openssl rand -base64 32 | tr -d '/+=' | head -c 32)
          printf '%s' "$mongo_password" > secrets/mongo_root_password.txt
          printf 'mongodb://recipes:%s@mongo:27017/recipes?authSource=admin&replicaSet=rs0' "$mongo_password" > secrets/mongo_url.txt
          printf '%s' "$redis_password" > secrets/redis_password.txt
          printf 'redis://:%s@redis:6379' "$redis_password" > secrets/redis_url.txt
          printf 'recipesadmin' > secrets/minio_root_user.txt
          gen > secrets/minio_root_password.txt
          gen > secrets/jwt_access_secret.txt
          gen > secrets/jwt_refresh_secret.txt

      # `--wait` falla si alguno de los healthchecks del compose no llega a healthy.
      - name: Start prod stack and wait for healthchecks
        run: docker compose -f docker-compose.prod.yml up --wait

      - name: Verify healthcheck status and endpoints
        run: |
          for service in backend frontend; do
            container=$(docker compose -f docker-compose.prod.yml ps -q "$service")
            health_status=$(docker inspect -f '{{.State.Health.Status}}' "$container")
            echo "$service healthcheck: $health_status"
            test "$health_status" = "healthy"
          done

          # Caddy termina TLS con su CA interna: `-k` y `--resolve` bastan para no
          # depender de DNS ni de confiar en la CA dentro del runner.
          for attempt in 1 2 3 4 5; do
            if curl -ksS --resolve recipes.local:443:127.0.0.1 \
              https://recipes.local/api/health | grep -q '"status":"ok"'; then
              break
            fi
            sleep 2
          done
          curl -ksS --resolve recipes.local:443:127.0.0.1 \
            https://recipes.local/api/health | grep -q '"status":"ok"'
          test "$(curl -ksS --resolve recipes.local:443:127.0.0.1 \
            -o /dev/null -w '%{http_code}' https://recipes.local/)" = "200"

      - name: Show prod stack logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Stop prod stack
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans
