name: CI

on:
  push:
    branches:
      - main
      - ci/github-actions
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm run build -w @recipe-planner/contracts

      - name: Unit tests with coverage
        run: npm run test:unit -w backend -- --coverage

      - name: Integration tests
        run: npm run test:integration -w backend

      - name: Build backend
        run: npm run build -w backend

      - name: Verify exported OpenAPI spec
        run: |
          npm run export:openapi -w backend
          git diff --exit-code -- packages/contracts/openapi.json

  frontend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Tests with coverage
        run: npm run test -w frontend -- --coverage

      - name: Next build
        run: npm run build -w frontend

      - name: Verify generated API types
        run: |
          npm run generate:api-types -w frontend
          git diff --exit-code -- frontend/src/server/openapi.d.ts
