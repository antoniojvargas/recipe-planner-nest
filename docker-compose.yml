name: recipe-planner

x-backend-environment: &backend-environment
  NODE_ENV: development
  PORT: '3000'
  APP_ENV: development
  LOG_LEVEL: debug
  MONGO_URL: mongodb://mongo:27017/recipes?replicaSet=rs0
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  # Host que se firma en las URLs que usa el navegador, no el de la red interna.
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_BUCKET: recipes
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  MAIL_FROM: Recipe Planner <no-reply@recipe-planner.local>
  FRONTEND_URL: http://localhost:3001
  API_INTERNAL_URL: http://backend:3000

services:
  mongo:
    image: mongo:7
    # Un replica set de un solo nodo: las transacciones multi-documento lo exigen.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # `rs.initiate` es idempotente: en el primer arranque inicializa; después lanza
      # AlreadyInitialized, que se ignora. Solo hay healthy cuando el nodo ya es primario.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval '
          try { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }); } catch (e) {}
          db.hello().isWritablePrimary' | grep -q true
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      MINIO_DEFAULT_BUCKETS: ''
    ports:
      - '9000:9000' # API S3
      - '9001:9001' # consola web
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1 || wget -qO- http://localhost:9000/minio/health/live >/dev/null 2>&1 || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  minio-init:
    image: alpine:3.20
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_BUCKET: recipes
    volumes:
      - ./infra/minio/cors.json:/config/cors.json:ro
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache aws-cli >/dev/null
        export AWS_CONFIG_FILE=/tmp/aws-config
        printf '[default]\ns3 =\n  addressing_style = path\n' > "$${AWS_CONFIG_FILE}"
        for i in $(seq 1 30); do
          aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1 && break
          sleep 1
        done
        aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1 || true
        # El bucket queda privado: el navegador sube y lee con URLs prefirmadas.
        aws --endpoint-url http://minio:9000 s3api put-bucket-cors --bucket "$${S3_BUCKET}" --cors-configuration file:///config/cors.json
    restart: 'no'

  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # interfaz web
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
    ports:
      - '3000:3000'
    # El código se monta para que `nest start --watch` recargue. Los volúmenes anónimos
    # conservan lo que instaló la imagen y evitan que el bind mount lo tape.
    volumes:
      - ./backend:/app/backend
      - ./packages/contracts:/app/packages/contracts
      - /app/backend/node_modules
      - /app/backend/dist
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # El worker comparte imagen con la API y ejecuta el build de Nest.
    # `dist/worker.js` llega con la fase de importación y miniaturas; hasta entonces
    # el servicio arranca y sale con error, sin afectar al resto de la pila.
    command: ['node', 'dist/worker.js']
    environment:
      <<: *backend-environment
    volumes:
      - ./backend:/app/backend
      - ./packages/contracts:/app/packages/contracts
      - /app/backend/node_modules
      - /app/backend/dist
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://backend:3000
      FRONTEND_URL: http://localhost:3001
      # El navegador conecta el socket directamente con el puerto publicado de la API.
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - '3001:3001'
    volumes:
      - ./frontend:/app/frontend
      - ./packages/contracts:/app/packages/contracts
      - /app/frontend/node_modules
      - /app/frontend/.next
    depends_on:
      backend:
        condition: service_started

volumes:
  mongo-data:
  minio-data:
